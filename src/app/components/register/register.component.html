<div class="register-wrapper">
    <p-card header="Crear Cuenta" [style]="{ width: '500px' }">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            
            <div class="form-field">
                <label for="name">Nombre Completo</label>
                <input pInputText id="name" formControlName="name" placeholder="Ej: Juan Pérez" />
                <small class="error-text" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
                    El nombre es obligatorio.
                </small>
            </div>

            <div class="form-field">
                <label for="email">Correo Electrónico</label>
                <input pInputText id="email" formControlName="email" type="email" placeholder="correo@ejemplo.com" />
                <small class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                    Ingresa un correo válido.
                </small>
            </div>

            <div class="form-field">
                <label for="password">Contraseña Segura</label>
                <input pInputText id="password" formControlName="password" type="password" placeholder="********" />
                
                <div class="password-hints" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                    <small class="error-text">La contraseña debe tener:</small>
                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Una mayúscula y una minúscula</li>
                        <li>Al menos un número y un carácter especial</li>
                    </ul>
                </div>
            </div>

            <div class="button-container">
                <p-button label="Registrarme" type="submit" [disabled]="registerForm.invalid" class="mr-2"></p-button>
                <p-button label="Ya tengo cuenta" variant="text" (onClick)="irALogin()" severity="secondary"></p-button>
            </div>
        </form>
    </p-card>
</div>
