<div class="login-container">
<p-card header="iniciar Sesion" [style]="{ width: '500px', 'min-height': '450px' }">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-4 mb-6">
            <div class="form-field">
                <label for="email">Correo Electrónico</label>
                <input pInputText id="email" formControlName="email" type="email">
            </div>
            <div class="form-field">
                <label for="password">Contraseña</label>
                <input pInputText id="password" formControlName="password" type="password">
            </div>
        </div>
    <div class="button-container">
        <p-button label="Ingresar" type="submit" [disabled]="loginForm.invalid"></p-button>
    </div>
    </form>
</p-card>
</div>
